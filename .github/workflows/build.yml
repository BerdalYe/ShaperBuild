name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and geometry kernel tests
        run: npm test
      - name: End-to-end tests (real Electron app)
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run test:e2e
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: test-output/*.png
          if-no-files-found: ignore

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use the tag as the version (v1.2.3 -> 1.2.3)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Connect accounts (Supabase project from the repository variables)
        if: vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != ''
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_GOOGLE: ${{ vars.SUPABASE_GOOGLE }}
        run: |
          node -e "require('fs').writeFileSync('electron/cloud-config.json', JSON.stringify({ url: process.env.SUPABASE_URL, anonKey: process.env.SUPABASE_ANON_KEY, google: process.env.SUPABASE_GOOGLE === 'true' }, null, 2) + '\n')"
          echo "Accounts connected to $SUPABASE_URL"
      - name: Build installer
        run: npm run dist
        env:
          # No paid certificates: Windows and Linux builds are not signed, and
          # the Mac app gets a free ad-hoc signature ("identity": "-" in
          # package.json). Without it, Apple Silicon Macs call the app
          # "damaged". Ad-hoc signing uses no secrets, so it can run for pull
          # requests too.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_FOR_PULL_REQUEST: true
      - name: Check the Mac app is signed
        if: runner.os == 'macOS'
        run: |
          for app in dist/mac*/ShaperBuild.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature=adhoc|Authority='
          done
      - uses: actions/upload-artifact@v5
        with:
          name: ShaperBuild-${{ runner.os }}
          # latest*.yml and .blockmap files let installed apps update themselves.
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          pattern: ShaperBuild-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
